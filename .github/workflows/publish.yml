name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Version matches tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/tensemem/__init__.py)
          echo "tag=$tag package=$ver"
          test "$tag" = "$ver"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.13.0
