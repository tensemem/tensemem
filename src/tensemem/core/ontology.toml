# Starter ontology. Seeded into every database on open; developers add their own
# predicates at runtime. ONE = a single current value; MANY = each value has its
# own lifecycle.

# --- Identity ---------------------------------------------------------------

[[predicates]]
name = "name"
description = "The subject's name"
pinned = true
aliases = ["full_name", "called", "named"]

[[predicates]]
name = "preferred_name"
description = "What the subject likes to be called"
pinned = true
aliases = ["nickname", "goes_by"]

[[predicates]]
name = "pronouns"
description = "The subject's pronouns"

[[predicates]]
name = "age"
value_type = "number"
description = "The subject's age in years"
aliases = ["years_old"]

[[predicates]]
name = "birthday"
value_type = "date"
description = "Date of birth"
aliases = ["birth_date", "date_of_birth", "dob", "born_on"]

[[predicates]]
name = "nationality"
description = "Country of citizenship"
aliases = ["citizenship"]

# --- Place and language -----------------------------------------------------

[[predicates]]
name = "lives_in"
value_type = "entity"
description = "City or place the subject currently lives in"
pinned = true
aliases = ["city", "home_city", "current_city", "location", "resides_in", "based_in"]

[[predicates]]
name = "hometown"
value_type = "entity"
description = "Where the subject grew up or was born"
aliases = ["born_in", "from", "native_place", "grew_up_in"]

[[predicates]]
name = "timezone"
description = "The subject's time zone"
aliases = ["tz", "time_zone"]

[[predicates]]
name = "speaks_language"
cardinality = "MANY"
description = "Natural languages the subject speaks"
aliases = ["speaks", "spoken_language"]

[[predicates]]
name = "preferred_language"
description = "Language the subject wants replies in"
aliases = ["reply_language", "response_language"]

# --- Work and education -----------------------------------------------------

[[predicates]]
name = "employer"
value_type = "entity"
description = "Organization the subject currently works for"
pinned = true
aliases = ["company", "works_at", "works_for", "workplace"]

[[predicates]]
name = "job_title"
description = "The subject's current role"
pinned = true
aliases = ["role", "title", "position", "occupation", "job"]

[[predicates]]
name = "industry"
description = "Industry the subject works in"

[[predicates]]
name = "team"
description = "Team the subject belongs to at work"

[[predicates]]
name = "manager"
value_type = "entity"
description = "The subject's manager"
aliases = ["boss", "reports_to"]

[[predicates]]
name = "works_on_project"
cardinality = "MANY"
description = "Projects the subject is working on"
aliases = ["project", "current_project", "working_on"]

[[predicates]]
name = "skill"
cardinality = "MANY"
description = "Skills or areas of expertise"
aliases = ["skills", "expertise", "good_at"]

[[predicates]]
name = "uses_language"
cardinality = "MANY"
value_type = "entity"
description = "Programming languages the subject uses"
aliases = ["programming_language", "codes_in", "writes_in"]

[[predicates]]
name = "uses_tool"
cardinality = "MANY"
value_type = "entity"
description = "Software tools, frameworks, or services the subject uses"
aliases = ["tool", "tools", "uses", "tech_stack"]

[[predicates]]
name = "preferred_editor"
value_type = "entity"
description = "Code editor or IDE the subject prefers"
aliases = ["editor", "ide", "preferred_ide"]

[[predicates]]
name = "operating_system"
value_type = "entity"
description = "Operating system the subject mainly uses"
aliases = ["os"]

[[predicates]]
name = "studied_at"
cardinality = "MANY"
value_type = "entity"
description = "Schools or universities the subject attended"
aliases = ["school", "university", "college", "alma_mater"]

[[predicates]]
name = "degree"
cardinality = "MANY"
description = "Academic degrees the subject holds"
aliases = ["qualification"]

# --- People and pets --------------------------------------------------------

[[predicates]]
name = "spouse"
value_type = "entity"
description = "The subject's spouse or partner"
aliases = ["wife", "husband", "partner", "married_to"]

[[predicates]]
name = "child"
cardinality = "MANY"
value_type = "entity"
description = "The subject's children"
aliases = ["children", "kid", "kids", "son", "daughter"]

[[predicates]]
name = "parent"
cardinality = "MANY"
value_type = "entity"
description = "The subject's parents"
aliases = ["mother", "father", "mom", "dad"]

[[predicates]]
name = "sibling"
cardinality = "MANY"
value_type = "entity"
description = "The subject's siblings"
aliases = ["brother", "sister"]

[[predicates]]
name = "friend"
cardinality = "MANY"
value_type = "entity"
description = "People the subject mentions as friends"
aliases = ["friends"]

[[predicates]]
name = "pet"
cardinality = "MANY"
description = "The subject's pets"
aliases = ["pets", "has_pet"]

# --- Preferences and lifestyle ----------------------------------------------

[[predicates]]
name = "likes"
cardinality = "MANY"
description = "Things the subject enjoys"
aliases = ["enjoys", "loves", "fan_of"]

[[predicates]]
name = "dislikes"
cardinality = "MANY"
description = "Things the subject dislikes"
aliases = ["hates", "does_not_like"]

[[predicates]]
name = "prefers"
cardinality = "MANY"
description = "General preferences, e.g. 'window seats' or 'short answers'"
aliases = ["preference", "preferences"]

[[predicates]]
name = "favorite_food"
cardinality = "MANY"
description = "Foods or cuisines the subject favors"
aliases = ["favourite_food", "favorite_cuisine"]

[[predicates]]
name = "hobby"
cardinality = "MANY"
description = "The subject's hobbies"
aliases = ["hobbies", "pastime"]

[[predicates]]
name = "exercise"
cardinality = "MANY"
description = "Sports or workouts the subject does"
aliases = ["sport", "plays_sport", "workout"]

[[predicates]]
name = "diet"
description = "Dietary pattern, e.g. vegetarian or vegan"
pinned = true
aliases = ["diet_type", "dietary_preference"]

[[predicates]]
name = "allergic_to"
cardinality = "MANY"
description = "Allergies"
pinned = true
aliases = ["allergy", "allergies"]

[[predicates]]
name = "communication_style"
description = "How the subject wants the assistant to respond"
aliases = ["tone", "response_style"]

[[predicates]]
name = "currency"
description = "Currency the subject uses or prefers"
aliases = ["preferred_currency"]

# --- Goals and belongings ---------------------------------------------------

[[predicates]]
name = "goal"
cardinality = "MANY"
