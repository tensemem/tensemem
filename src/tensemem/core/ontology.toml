[[predicates]]
name = "owns"
cardinality = "MANY"
description = "Notable things the subject owns"
aliases = ["possession"]

[[predicates]]
name = "vehicle"
cardinality = "MANY"
description = "Vehicles the subject owns or drives"
aliases = ["car", "drives"]

