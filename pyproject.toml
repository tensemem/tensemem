[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tensemem"
dynamic = ["version"]
description = "Memory that knows its tenses: an embedded, deterministic state memory engine for AI agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Shubham" }]
keywords = ["llm", "ai-agents", "memory", "temporal", "sqlite", "rag"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "dateparser>=1.4.3",
  "detect-secrets>=1.5",
  "pydantic>=2.12",
  "python-ulid>=3.1,<5",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=1.0"]
ollama = ["ollama>=0.4"]
litellm = ["litellm>=1.50"]
local = ["fastembed>=0.4"]

[project.scripts]
tensemem = "tensemem.cli:main"

[project.urls]
Homepage = "https://github.com/tensemem/tensemem"
Repository = "https://github.com/tensemem/tensemem"
Issues = "https://github.com/tensemem/tensemem/issues"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "ruff>=0.17",
  "pyright>=1.1.414",
  "pre-commit>=4",
  "hypothesis>=6.170.2",
]

[tool.hatch.version]
path = "src/tensemem/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tensemem"]

[tool.hatch.build.targets.wheel.force-include]
"src/tensemem/eval/tensebench_v1.jsonl" = "tensemem/eval/tensebench_v1.jsonl"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README.md", "LICENSE", "pyproject.toml", "mkdocs.yml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "C4",       # comprehensions
  "PT",       # pytest style
  "RET",      # return statements
  "PTH",      # prefer pathlib
  "DTZ",      # naive datetimes are bugs in a bi-temporal store
  "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["tensemem"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "live: calls a real model; skipped unless TENSEMEM_LIVE=1 and OPENAI_API_KEY is set",
]
